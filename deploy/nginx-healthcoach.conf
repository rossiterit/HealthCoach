# HealthCoach — nginx location block for the gotkapp.com server.
#
# Paste these two blocks inside the existing `server { server_name gotkapp.com; ... }`
# in /etc/nginx/sites-available/gotkapp.com. They reuse the existing certificate,
# so no DNS change and no new certbot run is needed.
#
# The Basic auth realm is its own, separate from the Keep's gate and separate
# from DrumCoach's — same pattern the owner chose for /drumcoach/. Do not remove
# auth_basic: the app performs no authentication of its own, and without this
# line the chat page and the whole store are public.
#
# Create the password file once (as root):
#     htpasswd -c /etc/nginx/healthcoach.htpasswd rossi
#
# Then: nginx -t && systemctl reload nginx

location = /healthcoach { return 301 /healthcoach/; }

location /healthcoach/ {
    auth_basic "HealthCoach";
    auth_basic_user_file /etc/nginx/healthcoach.htpasswd;

    # Trailing slash strips the /healthcoach prefix before it reaches the app.
    # (The app tolerates the prefix too, so this is belt and braces.)
    proxy_pass http://127.0.0.1:8789/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A coaching turn can involve several model calls; do not cut it short.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Single-file page: an update must land on the owner's next reload.
    add_header Cache-Control "no-cache";
}
