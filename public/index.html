<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DietCoach — HealthCoach</title>
<style>
  /* Paper & Ink — the house brand. Tokens match the DrumCoach build so the two
     apps read as one estate: warm paper field, dark crown, serif headings,
     uppercase micro-labels, cards with a single accent rule along the top. */
  :root {
    --paper: #f4ece0; --paper2: #efe5d6; --card: #faf5ec;
    --ink: #33291f; --muted: #8a7c6a; --line: #e0d4c2;
    --ac-green: #4f6b52; --ac-clay: #b5654a; --ac-slate: #4a5b7a;
    --ac-gold: #b08d57; --ac-plum: #6b4a5b;
    --warn-text: #a34a30;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    display: flex; flex-direction: column;
  }

  /* ---- Crown ---- */
  .crown {
    background: linear-gradient(#2b2118, #3a2e22);
    border-bottom: 2px solid var(--ac-gold);
    text-align: center; padding: 24px 20px 20px; flex: none;
  }
  .crown .monogram {
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ac-gold); margin-bottom: 6px;
  }
  .crown h1 {
    font-family: var(--serif); font-size: 32px; font-weight: 600;
    color: #f4ece0; line-height: 1.1;
  }
  .crown .vision {
    font-family: var(--serif); font-style: italic; color: #d9cbb4;
    font-size: 14px; margin-top: 6px;
  }

  /* ---- Toolbar ---- */
  .toolbar { background: var(--paper); border-bottom: 1px solid var(--line); flex: none; }
  .toolbar .inner {
    max-width: 760px; margin: 0 auto; padding: 9px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac-clay); flex: none; }
  .dot.ok { background: var(--ac-green); }
  .today { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* Tabs. Chat is the default view; the others are reference the owner opens
     deliberately, so they read as quiet labels rather than as competing calls. */
  .tabs { display: flex; gap: 2px; }
  .tab {
    font-family: var(--sans); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent;
    padding: 5px 10px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ac-gold); }
  .view[hidden] { display: none; }

  /* Stretch routine */
  .routine-head { margin-bottom: 4px; }
  .routine-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .routine-head h2::before { content: ""; display: inline-block; width: 22px; height: 2px; background: var(--ac-gold); vertical-align: middle; margin-right: 10px; }
  .routine-meta { color: var(--muted); font-size: 13px; margin: 2px 0 16px 32px; }
  .step {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ac-slate);
    border-radius: 12px; padding: 13px 16px; margin-bottom: 10px;
  }
  .step .n { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .step h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 2px 0 2px; }
  .step .dur { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ac-clay); margin-bottom: 6px; }
  .step .cue { font-size: 14px; }
  .step .why { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 5px; }
  /* Weight trend. Deliberately monochrome: the line is ink, the dots are ink.
     A green "good" direction and a red "bad" one would be a daily verdict
     delivered in colour, which is exactly what this release forbids. */
  .trend-card {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ac-gold);
    border-radius: 12px; padding: 15px 18px; margin-bottom: 18px;
  }
  .trend-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .trend-now { font-family: var(--serif); font-size: 30px; }
  .trend-unit { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .trend-line { font-size: 13px; color: var(--muted); }
  .spark { display: block; width: 100%; height: 68px; margin: 10px 0 2px; overflow: visible; }
  .spark path { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--ink); }
  .spark .band { stroke: var(--line); stroke-width: 1; }
  .spark-ends { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .tally { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px 32px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; display: flex; align-items: baseline; gap: 7px;
  }
  .chip-n { font-family: var(--serif); font-size: 17px; }
  .chip-l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .suggestion {
    background: var(--paper2); border: 1px solid var(--line); border-top: 3px solid var(--ac-green);
    border-radius: 12px; padding: 13px 16px; margin-top: 18px;
  }
  .suggestion .n { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .suggestion h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 3px 0 4px; }
  .suggestion .cue { font-size: 14px; }
  .suggestion .why { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 6px; }

  /* Sunday's meal-plan prompt. A card on the page, never a push — the
     one-touch-per-day rule stands, so this waits until the owner opens the app. */
  .prompt-card {
    background: var(--paper2); border: 1px solid var(--line); border-top: 3px solid var(--ac-plum);
    border-radius: 12px; padding: 13px 16px; margin-bottom: 18px;
  }
  .prompt-card .n { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .prompt-card h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 3px 0 4px; }
  .prompt-card p { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .prompt-card button {
    font-family: var(--sans); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: #f4ece0; background: #3a2e22; border: 1px solid #2b2118; border-radius: 999px;
    padding: 6px 16px; cursor: pointer;
  }
  .prompt-card button:hover { background: #2b2118; }
  .prompt-card .dismiss {
    background: none; border: none; color: var(--muted); text-transform: none;
    letter-spacing: 0; font-size: 12px; padding: 6px 8px;
  }

  .safety {
    border-left: 3px solid var(--ac-clay); padding: 8px 0 8px 12px; margin: 4px 0 18px;
    font-size: 13px; color: var(--muted);
  }
  .variants { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .variants button {
    font-family: var(--sans); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); background: var(--paper2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .variants button[aria-pressed="true"] { color: var(--ink); border-color: var(--ac-gold); background: var(--card); }
  .today b { font-family: var(--serif); font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }

  /* ---- Transcript ---- */
  main { flex: 1 1 auto; overflow-y: auto; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 20px 28px; }

  .turn { margin-bottom: 18px; display: flex; flex-direction: column; }
  .turn .tag {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  .turn.coach .bubble {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ac-gold);
    border-radius: 14px; padding: 14px 17px; align-self: flex-start; max-width: 92%;
  }
  .turn.owner { align-items: flex-end; }
  .turn.owner .tag { text-align: right; }
  .turn.owner .bubble {
    background: var(--paper2); border: 1px solid var(--line); border-top: 3px solid var(--ac-slate);
    border-radius: 14px; padding: 14px 17px; max-width: 92%;
  }
  .bubble p + p { margin-top: .7em; }

  /* ---- Logged-meal echo card (F3: the misparse must be visible) ---- */
  .meal {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ac-green);
    border-radius: 12px; padding: 13px 16px; margin-top: 10px; align-self: flex-start;
    max-width: 92%; width: 100%;
  }
  .meal.corrected { border-top-color: var(--ac-clay); }
  .meal .mtag {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-bottom: 4px;
  }
  .meal .est { color: var(--ac-clay); }
  .meal h3 { font-family: var(--serif); font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .meal ul { list-style: none; margin: 0 0 8px; }
  .meal li { font-size: 13px; color: var(--ink); padding: 1px 0; }
  .meal li span { color: var(--muted); }
  .macros { display: flex; flex-wrap: wrap; gap: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  .macro { min-width: 62px; }
  .macro .k { display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .macro .v { font-family: var(--serif); font-size: 16px; }

  .note { color: var(--muted); font-size: 13px; font-style: italic; }
  .err {
    color: var(--warn-text); font-size: 13px; border-left: 3px solid var(--warn-text);
    padding-left: 10px; margin-bottom: 18px;
  }

  /* ---- Composer ---- */
  footer { flex: none; background: var(--paper); border-top: 1px solid var(--line); }
  .composer { max-width: 760px; margin: 0 auto; padding: 12px 20px 16px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font-family: var(--sans); font-size: 15px; line-height: 1.5;
    color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 14px; min-height: 46px; max-height: 180px;
  }
  textarea:focus { outline: none; border-color: var(--ac-gold); }
  button.send {
    font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #f4ece0; background: #3a2e22; border: 1px solid #2b2118; border-radius: 12px;
    padding: 14px 20px; cursor: pointer;
  }
  button.send:hover { background: #2b2118; }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 0 auto; padding: 0 20px 12px; font-size: 11px; color: var(--muted); }

  @media (max-width: 560px) {
    .crown h1 { font-size: 26px; }
    .crown { padding: 18px 16px 15px; }
    .turn.coach .bubble, .turn.owner .bubble, .meal { max-width: 100%; }
  }

  /* --- the Plan tab (v3 F2) ---------------------------------------------
     Laid out to the owner's mockup: six day columns Monday–Saturday, four
     slot rows labelled vertically down a left gutter, a daily totals row
     under the grid, then search, then eight favourite tiles as two rows of
     four. The wireframe decides the structure; Paper & Ink decides the
     finish, per Decision 7. */

  #view-plan { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }

  .plan-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .plan-head h2 { font-family: var(--serif); font-weight: normal; font-size: 21px; margin: 0; }
  .plan-weeks { display: flex; gap: 2px; margin-left: auto; }
  .plan-weeks button {
    font: inherit; font-size: 12px; padding: 5px 12px; cursor: pointer;
    background: none; border: 1px solid var(--line); color: var(--muted);
  }
  .plan-weeks button:first-child { border-radius: 3px 0 0 3px; }
  .plan-weeks button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
  .plan-weeks button[aria-pressed="true"] { background: var(--card); color: var(--ink); border-color: var(--ink); }
  .plan-note { font-size: 11px; color: var(--muted); margin: 0 0 14px; }

  /* Gutter + six equal day columns. */
  .grid { display: grid; grid-template-columns: 26px repeat(6, minmax(0, 1fr)); gap: 6px; }
  .grid .corner { grid-column: 1; }
  .dayhead {
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 9px 6px; text-align: center; font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink);
  }
  .dayhead .dnum { display: block; font-size: 10px; color: var(--muted); letter-spacing: .02em; text-transform: none; margin-top: 2px; }
  .dayhead.is-today { border-color: var(--ac-gold); }

  /* The vertical slot label from the mockup: one letter per line. */
  .slotlabel {
    writing-mode: vertical-rl; text-orientation: upright;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; letter-spacing: .22em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px; background: var(--paper2);
  }

  .cell {
    min-height: 92px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--card); padding: 5px; display: flex; flex-direction: column; gap: 4px;
  }
  .cell.drop { border-color: var(--ac-green); background: #eef2ea; }
  .cell.armed { border-style: dashed; border-color: var(--ac-gold); cursor: copy; }

  .card {
    border: 1px solid var(--line); border-radius: 2px; background: var(--paper);
    padding: 5px 6px; font-size: 12px; line-height: 1.3; cursor: grab;
    display: flex; gap: 6px; align-items: flex-start;
  }
  .card:active { cursor: grabbing; }
  .card .cname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .card .cx {
    border: none; background: none; font: inherit; font-size: 13px; line-height: 1;
    color: var(--muted); cursor: pointer; padding: 0 2px;
  }
  .card .cx:hover { color: var(--ac-clay); }
  .card.sel { border-color: var(--ac-gold); background: #f7efe0; }

  /* Totals row, under the grid, one cell per day — mockup order:
     Calories | Protein | Fat | Carbs | Sodium. Plain ink: nothing here
     turns a colour, because nothing here is a verdict (Decision 4). */
  .totals {
    border: 1px solid var(--line); border-radius: 3px; background: var(--paper2);
    padding: 5px 4px; font-size: 10px; color: var(--ink); text-align: center;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 5px;
  }
  .totals .tv { white-space: nowrap; }
  .totals .tv b { font-weight: 600; }
  .totals.none { color: var(--muted); }

  .plan-tools { margin-top: 22px; display: grid; gap: 10px; }
  .searchrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .searchrow input {
    flex: 1 1 260px; font: inherit; font-size: 14px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--ink);
  }
  .searchrow button {
    font: inherit; font-size: 13px; padding: 9px 20px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .searchrow button:hover { background: var(--paper2); }
  .searchrow button:disabled { opacity: .5; cursor: default; }

  .results { display: grid; gap: 4px; }
  .result {
    border: 1px solid var(--line); border-radius: 3px; background: var(--card);
    padding: 7px 10px; font-size: 12px; cursor: grab;
    display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  }
  .result.sel { border-color: var(--ac-gold); background: #f7efe0; }
  .result .rname { font-weight: 600; font-size: 13px; }
  .result .rmacros { color: var(--muted); }
  .result .rpin {
    margin-left: auto; font: inherit; font-size: 11px; background: none;
    border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px;
    color: var(--muted); cursor: pointer;
  }
  .result .rpin:hover { color: var(--ink); border-color: var(--ink); }

  .favs-label { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-top: 6px; }
  /* Two rows of four, exactly as the mockup draws them. */
  .favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .fav {
    min-height: 46px; border: 1px solid var(--line); border-radius: 3px; background: var(--card);
    padding: 7px 9px; font-size: 12px; cursor: grab; display: flex; align-items: center;
    justify-content: space-between; gap: 6px; overflow-wrap: anywhere;
  }
  .fav.empty { color: var(--muted); font-style: italic; background: var(--paper2); cursor: default; }
  .fav.drop { border-color: var(--ac-green); background: #eef2ea; }
  .fav.sel { border-color: var(--ac-gold); background: #f7efe0; }
  .fav .fx { border: none; background: none; font: inherit; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .fav .fx:hover { color: var(--ac-clay); }

  .plan-msg { font-size: 12px; color: var(--muted); min-height: 17px; }
  .plan-msg.warn { color: var(--warn-text); }

  /* The armed-card banner for touch: tap a meal, then tap where it goes. */
  .arm-bar {
    position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--paper);
    border-radius: 3px; padding: 8px 12px; font-size: 12px; margin-bottom: 10px;
    display: flex; gap: 10px; align-items: center;
  }
  .arm-bar button {
    margin-left: auto; font: inherit; font-size: 11px; background: none; color: var(--paper);
    border: 1px solid rgba(244,236,224,.5); border-radius: 12px; padding: 2px 10px; cursor: pointer;
  }

  /* Phone: a six-column grid is unusable at 400px, so the same content
     stacks one day at a time. Tap-to-assign is the interaction here — it is
     offered at every width, not bolted on for touch. */
  @media (max-width: 760px) {
    #view-plan { padding: 16px; }
    .grid { display: block; }
    .grid .corner, .grid .slotlabel { display: none; }
    .dayblock { border: 1px solid var(--line); border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
    .dayblock .dayhead { border: none; border-bottom: 1px solid var(--line); border-radius: 0; }
    .dayblock .cell { border: none; border-bottom: 1px dashed var(--line); border-radius: 0; min-height: 0; }
    .dayblock .cell .slotname {
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    .dayblock .totals { border: none; border-radius: 0; }
    .favs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<header class="crown">
  <div class="monogram">HealthCoach</div>
  <h1>DietCoach</h1>
  <div class="vision">Tell me what you ate. I'll keep the record.</div>
</header>

<div class="toolbar">
  <div class="inner">
    <div class="status"><span class="dot" id="dot"></span><span id="state">connecting</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-chat" role="tab" aria-selected="true" aria-controls="view-chat">Chat</button>
      <button class="tab" id="tab-stretch" role="tab" aria-selected="false" aria-controls="view-stretch">Stretch</button>
      <button class="tab" id="tab-trend" role="tab" aria-selected="false" aria-controls="view-trend">Trend</button>
      <button class="tab" id="tab-plan" role="tab" aria-selected="false" aria-controls="view-plan">Plan</button>
    </div>
    <div class="today">Today <b id="today">—</b></div>
  </div>
</div>

<main id="main">
  <div class="view wrap" id="view-chat" role="tabpanel">
    <div id="promptSlot"></div>
    <div id="transcript"></div>
  </div>
  <div class="view wrap" id="view-stretch" role="tabpanel" hidden></div>
  <div class="view wrap" id="view-trend" role="tabpanel" hidden></div>
  <div class="view" id="view-plan" role="tabpanel" hidden></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="What have you eaten?" autofocus></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">Every nutrition figure here is the coach's estimate, not a measurement. Correct it by replying.</div>
</footer>

<script>
'use strict';
// The page is a plain client of the same /api/* surface Glorian will use later.
// It has no private endpoints of its own — that is the point of F7.
const API = new URL('.', location.href).pathname.replace(/\/$/, '') + '/api';

const $ = (id) => document.getElementById(id);
const transcript = $('transcript');
const input = $('input');
const sendBtn = $('send');

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/** Render paragraphs from plain text — never innerHTML, so model output can't inject markup. */
function paragraphs(parent, text) {
  String(text).split(/\n{2,}/).forEach((para) => {
    const p = el('p');
    para.split('\n').forEach((line, i) => {
      if (i) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(line));
    });
    parent.appendChild(p);
  });
}

function addTurn(role, text) {
  const turn = el('div', 'turn ' + (role === 'user' ? 'owner' : 'coach'));
  turn.appendChild(el('div', 'tag', role === 'user' ? 'You' : 'DietCoach'));
  const bubble = el('div', 'bubble');
  paragraphs(bubble, text);
  turn.appendChild(bubble);
  transcript.appendChild(turn);
  return turn;
}

const MACROS = [
  ['calories_kcal', 'kcal'],
  ['protein_g', 'protein'],
  ['carb_g', 'carb'],
  ['fat_g', 'fat'],
  ['fiber_g', 'fibre'],
  ['added_sugar_g', 'added sugar'],
];

function addMeal(meal, corrected) {
  const card = el('div', 'meal' + (corrected ? ' corrected' : ''));
  const tag = el('div', 'mtag');
  tag.appendChild(el('span', null, corrected ? 'Corrected' : 'Logged'));
  tag.appendChild(el('span', null, meal.mealType));
  tag.appendChild(el('span', 'est', meal.estimate ? 'estimated' : meal.provenance));
  card.appendChild(tag);
  card.appendChild(el('h3', null, meal.description));

  if (meal.items && meal.items.length) {
    const ul = el('ul');
    meal.items.forEach((it) => {
      const li = el('li');
      li.appendChild(document.createTextNode(it.name));
      if (it.quantity) {
        const s = el('span', null, ' — ' + it.quantity);
        li.appendChild(s);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  const macros = el('div', 'macros');
  let any = false;
  MACROS.forEach(([key, label]) => {
    const v = meal.nutrition ? meal.nutrition[key] : null;
    if (v === null || v === undefined) return;
    any = true;
    const m = el('div', 'macro');
    m.appendChild(el('span', 'k', label));
    m.appendChild(el('span', 'v', String(v)));
    macros.appendChild(m);
  });
  if (any) card.appendChild(macros);

  transcript.appendChild(card);
}

function addError(msg) {
  transcript.appendChild(el('div', 'err', msg));
  scroll();
}

function scroll() {
  $('main').scrollTop = $('main').scrollHeight;
}

function setState(ok, label) {
  $('dot').className = 'dot' + (ok ? ' ok' : '');
  $('state').textContent = label;
}

async function refreshToday() {
  try {
    const r = await fetch(API + '/summary');
    const d = await r.json();
    const kcal = d.nutrition && d.nutrition.calories_kcal;
    $('today').textContent = d.count
      ? (kcal ? kcal + ' kcal est.' : d.count + ' logged')
      : 'nothing logged';
  } catch { /* the toolbar is decoration; a failure here must not break the chat */ }
}

async function boot() {
  try {
    const h = await (await fetch(API + '/health')).json();
    setState(true, h.onboarded ? 'ready' : 'first conversation');
    if (h.mealPlanPrompt) showMealPlanPrompt();
  } catch {
    setState(false, 'offline');
  }

  try {
    const hist = await (await fetch(API + '/history?limit=60')).json();
    const mealsById = {};
    (hist.meals || []).forEach((m) => { mealsById[m.id] = m; });
    (hist.messages || []).forEach((m) => {
      addTurn(m.role, m.text);
      (m.loggedIds || []).forEach((id) => { if (mealsById[id]) addMeal(mealsById[id], false); });
    });
    if (!(hist.messages || []).length) {
      const t = addTurn('assistant', "We haven't spoken yet. Say hello and I'll ask you a few things about what you're after — or just tell me what you ate and we'll start there.");
      t.classList.add('intro');
    }
  } catch {
    addError('Could not load the conversation. The coach service may be down.');
  }
  refreshToday();
  scroll();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  addTurn('user', text);
  scroll();

  sendBtn.disabled = true;
  const thinking = el('div', 'note', 'DietCoach is thinking…');
  transcript.appendChild(thinking);
  scroll();

  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const d = await r.json();
    thinking.remove();
    if (!r.ok) { addError(d.error || 'The coach could not answer that.'); return; }
    addTurn('assistant', d.reply);
    (d.logged || []).forEach((m) => addMeal(m, false));
    (d.corrected || []).forEach((m) => addMeal(m, true));
    refreshToday();
    setState(true, 'ready');
  } catch (e) {
    thinking.remove();
    addError('Could not reach the coach. Check the service is running.');
    setState(false, 'offline');
  } finally {
    sendBtn.disabled = false;
    scroll();
    input.focus();
  }
}

// --- Sunday's meal-plan prompt --------------------------------------------
// Deliberately a card the owner finds when they open the app, not a message
// that arrives. F6 is explicit that this must not become a second daily push.

  const slot = $('promptSlot');

// Chat is the default. The composer belongs to the chat view only — leaving it
// visible under the routine would invite typing into a page that isn't listening.
const TABS = [
  { tab: 'tab-chat', view: 'view-chat' },
  { tab: 'tab-stretch', view: 'view-stretch' },
  { tab: 'tab-trend', view: 'view-trend' },

];
let stretchLoaded = false;

function showTab(id) {
  TABS.forEach(({ tab, view }) => {

async function loadStretch(variant) {

  host.appendChild(el('div', 'note', 'Loading the routine…'));

function renderRoutine(host, d, active) {
  const head = el('div', 'routine-head');
  head.appendChild(el('h2', null, d.routine.title));
  host.appendChild(head);
  host.appendChild(el('div', 'routine-meta', `About ${d.routine.totalMinutes} minutes · ${d.routine.steps.length} movements — ${d.routine.intent}`));

  host.appendChild(el('div', 'safety', d.safetyNote));

    card.appendChild(el('div', 'dur', s.duration));

// --- trend view: what was actually done -----------------------------------
async function loadTrend() {
  const host = $('view-trend');
  host.textContent = '';
  host.appendChild(el('div', 'note', 'Loading…'));
  try {
    const [w, d] = await Promise.all([
      fetch(API + '/weight').then((r) => r.json()),
      fetch(API + '/movement?days=7').then((r) => r.json()),
    ]);
    host.textContent = '';
    renderWeight(host, w);
    renderMovement(host, d);
  } catch {
    host.textContent = '';
    host.appendChild(el('div', 'err', 'Could not load. The service may be down.'));
  }
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, String(v)));
  return n;
}

function sparkline(points) {
  const W = 600, H = 68, PAD = 6;
  const el = svg('svg', { class: 'spark', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });
  const vals = points.map((p) => p.lb);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // A flat span still needs a band, or every point lands on one pixel row.
  const span = hi - lo < 0.6 ? 0.6 : hi - lo;
  const mid = (hi + lo) / 2;
  const top = mid + span / 2, bot = mid - span / 2;
  const x = (i) => (points.length === 1 ? W / 2 : PAD + (i * (W - PAD * 2)) / (points.length - 1));
  const y = (v) => PAD + ((top - v) / (top - bot)) * (H - PAD * 2);

  el.appendChild(svg('line', { class: 'band', x1: 0, y1: y(mid), x2: W, y2: y(mid) }));
  if (points.length > 1) {
    el.appendChild(svg('path', { d: points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.lb).toFixed(1)}`).join(' ') }));
  }
  points.forEach((p, i) => el.appendChild(svg('circle', { cx: x(i).toFixed(1), cy: y(p.lb).toFixed(1), r: i === points.length - 1 ? 3.5 : 2 })));
  return el;
}

function renderWeight(host, w) {
  const head = el('div', 'routine-head');
  head.appendChild(el('h2', null, 'Weight'));
  host.appendChild(head);

  const card = el('div', 'trend-card');
  const week = w.week || {};
  if (!week.count) {
    card.appendChild(el('div', 'trend-line', 'Nothing logged yet. Tell the coach a number whenever you feel like it.'));
    host.appendChild(card);
    return;
  }

  const row = el('div', 'trend-row');
  row.appendChild(el('span', 'trend-now', String(week.latest.lb)));
  row.appendChild(el('span', 'trend-unit', w.unit));
  card.appendChild(row);

  // Both windows, stated flatly. No target line, no arrow, no adjective.
  card.appendChild(el('div', 'trend-line', w.lines.week));
  card.appendChild(el('div', 'trend-line', w.lines.month));

  const pts = (w.month && w.month.points && w.month.points.length > 1 ? w.month : week).points;
  if (pts && pts.length) {
    card.appendChild(sparkline(pts));
    const ends = el('div', 'spark-ends');
    ends.appendChild(el('span', null, pts[0].date));
    ends.appendChild(el('span', null, pts[pts.length - 1].date));
    card.appendChild(ends);
  }
  host.appendChild(card);
}

function renderMovement(host, d) {
  const head = el('div', 'routine-head');
  head.appendChild(el('h2', null, 'This week'));
  host.appendChild(head);

  // States what happened. There is no streak, no active-day count, no target
  // bar and no gap — by design, and the API does not send them either.
  if (!d.week.count) {
    host.appendChild(el('div', 'routine-meta', 'Nothing recorded yet this week.'));
  } else {
    const mins = d.week.totalMinutes ? ` · about ${d.week.totalMinutes} minutes all in` : '';
    host.appendChild(el('div', 'routine-meta', `${d.week.count} recorded${mins}`));

    const tally = el('div', 'tally');
    d.week.byOutlet.forEach((o) => {
      const chip = el('div', 'chip');
      chip.appendChild(el('span', 'chip-n', String(o.count)));
      chip.appendChild(el('span', 'chip-l', o.label));
      tally.appendChild(chip);
    });
    host.appendChild(tally);

    d.week.entries.forEach((w) => {
      const card = el('div', 'step');
      card.appendChild(el('div', 'n', `${w.date} · ${w.outletLabel}`));
      card.appendChild(el('h3', null, w.description));
      const bits = [];
      if (w.durationMinutes) bits.push(`${w.durationMinutes} min`);
      if (w.intensity) bits.push(w.intensity);
      if (bits.length) card.appendChild(el('div', 'dur', bits.join(' · ')));
      if (w.notes) card.appendChild(el('div', 'why', w.notes));
      host.appendChild(card);
    });
  }

  if (d.suggestion) {
    const s = el('div', 'suggestion');
    s.appendChild(el('div', 'n', 'If you fancy it today'));
    s.appendChild(el('h3', null, d.suggestion.outlet.label));
    s.appendChild(el('div', 'cue', d.suggestion.reason));
    if (d.suggestion.tradeDown) {
      s.appendChild(el('div', 'why', `Not happening? ${d.suggestion.tradeDown.label} counts just the same.`));
    }
    host.appendChild(s);
  }
}

// --- the Plan tab (v3 F2) -------------------------------------------------
//
// Two ways to move a meal, both live at every width:
//   drag-and-drop, for a pointer; and
//   tap-to-assign — tap a meal to arm it, tap where it goes.
// Tap is not a touch fallback bolted onto a mouse design. It is the only thing
// that works on a phone, and it works identically on a desktop, which also
// makes it the thing that is actually keyboard- and test-reachable.
//
// THE GRID PLANS. Nothing on this tab logs anything: there is no call here to
// /api/chat or /api/meals, and the only writes go to /api/plan/* and
// /api/favorites. That is Decision 1, kept true by what this code cannot do.

const plan = {
  week: null,      // the weekStart being shown
  weeks: [],       // [current, next]
  data: null,      // the /api/plan payload
  results: [],     // current search results
  armed: null,     // { kind: 'food'|'entry', foodId, entryId, name }
};

function planMsg(text, warn) {
  const m = $('plan-msg');
  if (!m) return;
  m.textContent = text || '';
  m.className = 'plan-msg' + (warn ? ' warn' : '');
}

async function planApi(path, body) {
  const res = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'That did not save.');
  return data;
}

/** Arm a meal for tap-to-assign, or disarm if it was already armed. */
function arm(what) {
  const same = plan.armed && plan.armed.entryId === what.entryId && plan.armed.foodId === what.foodId;
  plan.armed = same ? null : what;
  renderPlan();
}

function applyPlanPayload(d) {
  if (d.plan) plan.data = d.plan;
  if (d.favorites) plan.data.favorites = d.favorites;
  renderPlan();
}

async function loadPlan(week) {
  const host = $('view-plan');
  if (!plan.data) { host.textContent = ''; host.appendChild(el('div', 'note', 'Loading the week…')); }
  try {
    const d = await planApi('/plan' + (week ? '?week=' + encodeURIComponent(week) : ''));
    plan.week = d.weekStart;
    plan.weeks = d.weeks || [];
    plan.data = d;
    renderPlan();
  } catch (e) {
    host.textContent = '';
    host.appendChild(el('div', 'note', 'Could not load the plan: ' + e.message));
  }
}

/** "Mon 21 Sep – Sat 26 Sep", for the heading. */
function weekLabel(d) {
  const days = d.days || [];
  if (!days.length) return '';
  const a = days[0], b = days[days.length - 1];
  return `${a.short} ${a.dayNum} ${a.month} – ${b.short} ${b.dayNum} ${b.month}`;
}

function totalsNode(t) {
  const n = el('div', 'totals' + (t.count ? '' : ' none'));
  if (!t.count) { n.textContent = 'nothing planned'; return n; }
  // Mockup order, fixed: Calories | Protein | Fat | Carbs | Sodium.
  t.fields.forEach((f, i) => {
    const v = el('span', 'tv');
    if (f.value === null || f.value === undefined) {
      v.textContent = `${f.label} —`;
    } else {
      const b = el('b', null, String(f.value) + f.unit);
      v.appendChild(b);
      v.appendChild(document.createTextNode(' ' + f.label));
    }
    n.appendChild(v);
    if (i < t.fields.length - 1) n.appendChild(el('span', 'tv', '|'));
  });
  return n;
}

function cardNode(card, day, slot) {
  const c = el('div', 'card' + (plan.armed && plan.armed.entryId === card.entryId ? ' sel' : ''));
  c.draggable = true;
  c.appendChild(el('span', 'cname', card.name));

  const x = el('button', 'cx', '×');
  x.title = 'Take this off the plan';
  x.setAttribute('aria-label', `Remove ${card.name} from ${day.weekday} ${slot.label}`);
  x.addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      // Removing a card is removing an intention. The food stays in the
      // library — the API says deleted:false and the wording matches.
      applyPlanPayload(await planApi('/plan/remove', { week: plan.week, entryId: card.entryId }));
      planMsg(`Took ${card.name} off ${day.weekday}. It is still in your library.`);
    } catch (err) { planMsg(err.message, true); }
  });
  c.appendChild(x);

  c.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', JSON.stringify({ kind: 'entry', entryId: card.entryId, foodId: card.foodId, name: card.name }));
    e.dataTransfer.effectAllowed = 'move';
  });
  c.addEventListener('click', () => arm({ kind: 'entry', entryId: card.entryId, foodId: card.foodId, name: card.name }));
  return c;
}

/** Drop a payload into a day slot: a move if it came from the grid, else new. */
async function dropIntoSlot(payload, date, slot) {
  try {
    if (payload.kind === 'entry') {
      applyPlanPayload(await planApi('/plan/move', { week: plan.week, entryId: payload.entryId, date, slot }));
      planMsg(`Moved ${payload.name}.`);
    } else {
      applyPlanPayload(await planApi('/plan/assign', { week: plan.week, date, slot, foodId: payload.foodId }));
      planMsg(`Added ${payload.name}.`);
    }
    plan.armed = null;
    renderPlan();
  } catch (e) { planMsg(e.message, true); }
}

function cellNode(day, slot, stacked) {
  const cell = el('div', 'cell' + (plan.armed ? ' armed' : ''));
  if (stacked) cell.appendChild(el('div', 'slotname', slot.label));
  slot.cards.forEach((card) => cell.appendChild(cardNode(card, day, slot)));

  cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('drop'); });
  cell.addEventListener('dragleave', () => cell.classList.remove('drop'));
  cell.addEventListener('drop', (e) => {
    e.preventDefault();
    cell.classList.remove('drop');
    let payload; try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    dropIntoSlot(payload, day.date, slot.slot);
  });
  // Tap-to-assign: the armed meal lands here.
  cell.addEventListener('click', (e) => {
    if (!plan.armed || e.target.closest('.card')) return;
    dropIntoSlot(plan.armed, day.date, slot.slot);
  });
  return cell;
}

function renderPlan() {
  const host = $('view-plan');
  const d = plan.data;
  host.textContent = '';
  if (!d) return;

  const head = el('div', 'plan-head');
  const h = el('h2', null, 'Plan');
  head.appendChild(h);
  head.appendChild(el('span', 'plan-note', weekLabel(d)));

  const weeks = el('div', 'plan-weeks');
  ['This week', 'Next week'].forEach((label, i) => {
    const b = el('button', null, label);
    b.setAttribute('aria-pressed', String(plan.weeks[i] === plan.week));
    b.addEventListener('click', () => loadPlan(plan.weeks[i]));
    weeks.appendChild(b);
  });
  head.appendChild(weeks);
  host.appendChild(head);

  // Sunday is not a column that got hidden — it was never in the data.
  host.appendChild(el('p', 'plan-note', 'Monday to Saturday. Sunday is yours. Totals are estimates.'));

  if (plan.armed) {
    const bar = el('div', 'arm-bar');
    bar.appendChild(el('span', null, `${plan.armed.name} — now tap a meal slot, or a favourite tile.`));
    const cancel = el('button', null, 'Cancel');
    cancel.addEventListener('click', () => { plan.armed = null; renderPlan(); });
    bar.appendChild(cancel);
    host.appendChild(bar);
  }

  const stacked = window.matchMedia('(max-width: 760px)').matches;
  const grid = el('div', 'grid');

  if (stacked) {
    // Phone: one day at a time, same content, same interactions.
    d.days.forEach((day) => {
      const block = el('div', 'dayblock');
      const hd = el('div', 'dayhead' + (day.date === d.today ? ' is-today' : ''));
      hd.appendChild(document.createTextNode(day.weekday));
      hd.appendChild(el('span', 'dnum', `${day.dayNum} ${day.month}`));
      block.appendChild(hd);
      day.slots.forEach((slot) => block.appendChild(cellNode(day, slot, true)));
      block.appendChild(totalsNode(day.totals));
      grid.appendChild(block);
    });
  } else {
    grid.appendChild(el('div', 'corner'));
    d.days.forEach((day) => {
      const hd = el('div', 'dayhead' + (day.date === d.today ? ' is-today' : ''));
      hd.appendChild(document.createTextNode(day.weekday));
      hd.appendChild(el('span', 'dnum', `${day.dayNum} ${day.month}`));
      grid.appendChild(hd);
    });
    d.slots.forEach((s, row) => {
      // The vertical gutter label from the mockup.
      grid.appendChild(el('div', 'slotlabel', s.label.toUpperCase()));
      d.days.forEach((day) => grid.appendChild(cellNode(day, day.slots[row], false)));
    });
    grid.appendChild(el('div', 'corner'));
    d.days.forEach((day) => grid.appendChild(totalsNode(day.totals)));
  }
  host.appendChild(grid);

  // --- search + favourites ---
  const tools = el('div', 'plan-tools');

  const row = el('div', 'searchrow');
  const field = el('input');
  field.id = 'plan-q';
  field.placeholder = 'Search your food library…';
  field.setAttribute('aria-label', 'Search your food library');
  field.value = plan.lastQuery || '';
  const btn = el('button', null, 'Search');
  btn.addEventListener('click', () => runSearch(field.value));
  field.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runSearch(field.value); } });
  row.appendChild(field);
  row.appendChild(btn);
  tools.appendChild(row);

  const msg = el('div', 'plan-msg', '');
  msg.id = 'plan-msg';
  tools.appendChild(msg);

  const results = el('div', 'results');
  plan.results.forEach((r) => results.appendChild(resultNode(r)));
  if (plan.searchMiss) results.appendChild(missNode());
  tools.appendChild(results);

  tools.appendChild(el('div', 'favs-label', 'FAVOURITES'));
  const favs = el('div', 'favs');
  (d.favorites || []).forEach((f, i) => favs.appendChild(favNode(f, i)));
  tools.appendChild(favs);

  host.appendChild(tools);
  if (plan.pendingMsg) { planMsg(plan.pendingMsg.text, plan.pendingMsg.warn); plan.pendingMsg = null; }
}

function macroLine(n) {
  const bits = [];
  const add = (v, suffix, label) => { if (v !== null && v !== undefined) bits.push(`${v}${suffix} ${label}`); };
  if (n.calories_kcal !== null && n.calories_kcal !== undefined) bits.push(`${n.calories_kcal} Calories`);
  add(n.protein_g, 'g', 'Protein'); add(n.fat_g, 'g', 'Fat');
  add(n.carb_g, 'g', 'Carbs'); add(n.sodium_mg, 'mg', 'Sodium');
  return bits.join(' | ');
}

function resultNode(r) {
  const n = el('div', 'result' + (plan.armed && plan.armed.foodId === r.id && plan.armed.kind === 'food' ? ' sel' : ''));
  n.draggable = true;
  n.appendChild(el('span', 'rname', r.name));
  n.appendChild(el('span', 'rmacros', macroLine(r.nutrition || {})));

  const pin = el('button', 'rpin', r.favoriteSlot === null ? 'Pin' : 'Pinned');
  pin.addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      const out = await planApi('/favorites', { foodId: r.id });
      plan.data.favorites = out.favorites;
      plan.pendingMsg = { text: out.replaced ? `Pinned ${r.name}; that replaced ${out.replaced.name}, which is still in your library.` : `Pinned ${r.name}.` };
      await runSearch(plan.lastQuery, true);
    } catch (err) { planMsg(err.message, true); }
  });
  n.appendChild(pin);

  n.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', JSON.stringify({ kind: 'food', foodId: r.id, name: r.name }));
    e.dataTransfer.effectAllowed = 'copy';
  });
  n.addEventListener('click', () => arm({ kind: 'food', foodId: r.id, name: r.name }));
  return n;
}

/** The create-on-miss offer. Typing never writes; this button does. */
function missNode() {
  const n = el('div', 'result');
  n.appendChild(el('span', 'rmacros', `"${plan.lastQuery}" is not in your library yet.`));
  const b = el('button', 'rpin', 'Add it');
  b.addEventListener('click', async () => {
    b.disabled = true;
    b.textContent = 'Estimating…';
    try {
      const out = await planApi('/foods', { name: plan.lastQuery });
      plan.pendingMsg = { text: `Added ${out.food.name} — ${macroLine(out.food.nutrition)}. That is my estimate; correct it in chat if it is off.` };
      await runSearch(plan.lastQuery, true);
    } catch (e) { planMsg(e.message, true); b.disabled = false; b.textContent = 'Add it'; }
  });
  n.appendChild(b);
  return n;
}

function favNode(f, slot) {
  const n = el('div', 'fav' + (f ? '' : ' empty') + (plan.armed && f && plan.armed.foodId === f.id ? ' sel' : ''));
  n.appendChild(el('span', null, f ? f.name : 'empty'));

  if (f) {
    n.draggable = true;
    const x = el('button', 'fx', '×');
    x.title = 'Unpin — the meal stays in your library';
    x.setAttribute('aria-label', `Unpin ${f.name}`);
    x.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        const out = await planApi('/favorites', { action: 'unpin', slot });
        plan.data.favorites = out.favorites;
        renderPlan();
        planMsg(`Unpinned ${f.name}. It is still in your library.`);
      } catch (err) { planMsg(err.message, true); }
    });
    n.appendChild(x);
    n.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ kind: 'food', foodId: f.id, name: f.name }));
      e.dataTransfer.effectAllowed = 'copy';
    });
  }

  // Favourites take drops from both directions (Decision 5). A drop from a day
  // slot COPIES: the day keeps its meal.
  n.addEventListener('dragover', (e) => { e.preventDefault(); n.classList.add('drop'); });
  n.addEventListener('dragleave', () => n.classList.remove('drop'));
  n.addEventListener('drop', (e) => {
    e.preventDefault();
    n.classList.remove('drop');
    let payload; try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    pinInto(payload, slot);
  });

  // ONE click handler, which decides. Two handlers here — one to arm the tile,
  // one to receive an armed meal — both fire on a single tap, so arming a
  // favourite immediately pinned it back onto itself and nothing looked armed.
  n.addEventListener('click', (e) => {
    if (e.target.closest('.fx')) return;
    // Something armed elsewhere lands here. Tapping the armed tile itself
    // disarms rather than pinning it onto its own slot.
    if (plan.armed && !(f && plan.armed.foodId === f.id && plan.armed.kind === 'food')) return pinInto(plan.armed, slot);
    if (f) arm({ kind: 'food', foodId: f.id, name: f.name });
  });
  return n;
}

async function pinInto(payload, slot) {
  try {
    let out, kept = false;
    if (payload.kind === 'entry') {
      // Slot -> tile is a COPY. planner.pinFromSlot leaves the grid alone.
      out = await planApi('/plan/pin', { week: plan.week, entryId: payload.entryId, slot });
      kept = true;
      applyPlanPayload(out);
    } else {
      out = await planApi('/favorites', { foodId: payload.foodId, slot });
      plan.data.favorites = out.favorites;
      renderPlan();
    }
    plan.armed = null;
    const replaced = out.replaced ? ` That replaced ${out.replaced.name || 'the old favourite'}, which is still in your library.` : '';
    planMsg(`Pinned ${payload.name}.` + (kept ? ' It is still on the day too.' : '') + replaced);
    renderPlan();
  } catch (e) { planMsg(e.message, true); }
}

async function runSearch(q, quiet) {
  plan.lastQuery = q;
  if (!q || !q.trim()) { plan.results = []; plan.searchMiss = false; renderPlan(); return; }
  try {
    const d = await planApi('/foods?q=' + encodeURIComponent(q.trim()));
    plan.results = d.results || [];
    plan.searchMiss = Boolean(d.miss);
    renderPlan();
    if (!quiet && !plan.results.length) planMsg('Nothing in your library matches that yet.');
  } catch (e) { planMsg(e.message, true); }
}

// The stacked/grid decision is made at render time, so a rotation or a resize
// has to re-render or the phone layout would persist on a widened window.
let planResizeTimer = null;
window.addEventListener('resize', () => {
  if (!plan.data || $('view-plan').hidden) return;
  clearTimeout(planResizeTimer);
  planResizeTimer = setTimeout(renderPlan, 150);
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

boot();
</script>
</body>
</html>
